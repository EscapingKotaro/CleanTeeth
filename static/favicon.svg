<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .bg { fill: #272e37; }
    .fg { fill: #ffffff; }
    .bowl { stroke: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #e8edf2; }
      .fg { fill: #1a2027; }
      .bowl { stroke: #1a2027; }
    }
  </style>

  <!-- Плашка с фирменным скруглением -->
  <rect class="bg" width="64" height="64" rx="14"/>

  <!-- Стеклянный блик сверху -->
  <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
    <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <rect width="64" height="64" rx="14" fill="url(#gloss)"/>

  <!-- Буква d: чаша + ножка -->
  <circle class="bowl" cx="30" cy="39" r="10" fill="none" stroke-width="7"/>
  <rect class="fg" x="40" y="12" width="7.5" height="40.5" rx="3.75"/>
</svg>