<div x-show="modal === 'lost'" x-cloak class="fixed inset-0 z-50" style="display:flex;align-items:center;justify-content:center;padding:16px;">
    <form method="post" action="{% url 'crm:case_change_status' case.id %}"
          class="dg-panel" style="max-width:440px;width:100%;margin:0;background:var(--dg-solid);max-height:90vh;overflow-y:auto;" @click.stop>
        {% csrf_token %}
        <input type="hidden" name="status" value="LOST">
        <div class="dg-panelhead"><h2 style="color:var(--dg-warn);">Отказ / потерян</h2></div>
        <p class="dg-muted">Все поля обязательны. Активные задачи будут отменены.</p>
        <div style="display:grid;gap:12px;margin-top:12px;">
            <label class="dg-muted" style="display:grid;gap:6px;">Дата отказа <span style="color:var(--dg-warn);">*</span>
                <input type="date" name="lost_date" value="{% now 'Y-m-d' %}" required>
            </label>
            <label class="dg-muted" style="display:grid;gap:6px;">Причина отказа <span style="color:var(--dg-warn);">*</span>
                <select name="lost_reason" required>
                    <option value="">Выберите причину</option>
                    {% for r in lost_reasons %}
                    <option value="{{ r.id }}">{{ r.title }}</option>
                    {% endfor %}
                </select>
            </label>
            <label class="dg-muted" style="display:grid;gap:6px;">Сумма потенциального плана, ₽ <span style="color:var(--dg-warn);">*</span>
                <input type="number" step="0.01" name="lost_potential_sum"
                       value="{{ case.plan.agreed_sum|default:case.plan.presentation_sum }}" required>
            </label>
            <label class="dg-muted" style="display:grid;gap:6px;">Комментарий <span style="color:var(--dg-warn);">*</span>
                <textarea name="lost_comment" rows="2" required></textarea>
            </label>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px;">
            <button type="button" @click="modal = null">Отмена</button>
            <button type="submit" style="border-color:var(--dg-warn);color:var(--dg-warn);">Закрыть как отказ</button>
        </div>
    </form>
</div>
