<div x-show="modal === 'directions'" x-cloak class="fixed inset-0 z-50" style="display:flex;align-items:center;justify-content:center;padding:16px;">
    <form method="post" action="{% url 'crm:plan_directions_update' case.plan.id %}"
          class="dg-panel" style="max-width:420px;width:100%;margin:0;background:var(--dg-solid);" @click.stop>
        {% csrf_token %}
        <div class="dg-panelhead"><h2>Направления лечения</h2></div>
        <p class="dg-muted">Сумма по направлениям должна совпадать с согласованной ({{ case.plan.agreed_sum }} ₽).</p>
        <div style="display:grid;gap:12px;margin-top:12px;">
            {% for value, label in directions %}
            <label class="dg-muted" style="display:grid;gap:6px;">{{ label }}, ₽
                <input type="number" step="0.01" name="direction_{{ value }}"
                       value="{% for d in case.plan.directions.all %}{% if d.direction == value %}{{ d.amount }}{% endif %}{% endfor %}">
            </label>
            {% endfor %}
        </div>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px;">
            <button type="button" @click="modal = null">Отмена</button>
            <button type="submit" class="btn-primary">Сохранить</button>
        </div>
    </form>
</div>
