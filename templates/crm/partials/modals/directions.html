    <div x-show="modal === 'directions'" x-cloak class="fixed inset-0 z-50" style="display:flex;align-items:center;justify-content:center;padding:16px;">
        <form method="post" action="{% url 'crm:plan_directions_update' case.plan.id %}" class="dg-panel"
              style="max-width:440px;width:100%;margin:0;background:var(--dg-solid);" @click.stop
              x-data="{
                  sums: { {% for value, label, amount in directions %}'{{ value }}': {{ amount|floatformat:2 }}{% if not forloop.last %}, {% endif %}{% endfor %} },
                  get total() { return Object.values(this.sums).reduce((a, b) => a + (parseFloat(b) || 0), 0); },
                  get mismatch() { return Math.abs(this.total - {{ case.plan.agreed_sum|default:0|floatformat:2 }}) > 0.009; }
              }">
            {% csrf_token %}
            <div class="dg-panelhead"><h2>Направления лечения</h2></div>
            <p class="dg-muted" style="margin-bottom:12px;"
               :style="mismatch ? 'color:var(--dg-warn);font-weight:600;' : 'color:var(--dg-green);'">
                Сумма направлений: <span x-text="total.toFixed(2)"></span> ₽
                из согласованных <b>{{ case.plan.agreed_sum|floatformat:2 }} ₽</b>
                <span x-show="mismatch">— расхождение!</span>
                <span x-show="!mismatch">— сходится.</span>
            </p>
            <div style="display:grid;gap:12px;">
                {% for value, label, amount in directions %}
                <label class="dg-muted" style="display:grid;gap:6px;">{{ label }}, ₽
                    <input type="number" step="0.01" name="direction_{{ value }}" x-model="sums['{{ value }}']">
                </label>
                {% endfor %}
            </div>
            <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px;">
                <button type="button" @click="modal = null">Отмена</button>
                <button type="submit" class="btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
