<div x-show="modal === 'edit_patient'" x-cloak class="fixed inset-0 z-50" style="display:flex;align-items:center;justify-content:center;padding:16px;">
    <form method="post" action="{% url 'crm:patient_update' case.patient.id %}"
          class="dg-panel" style="max-width:720px;width:100%;margin:0;background:var(--dg-solid);max-height:90vh;overflow-y:auto;" @click.stop>
        {% csrf_token %}
        <div class="dg-panelhead"><h2>Редактировать пациента</h2></div>
        <div style="display:grid;gap:12px;">
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;">
                <label class="dg-muted" style="display:grid;gap:6px;">Фамилия
                    <input type="text" name="last_name" value="{{ case.patient.last_name }}" required>
                </label>
                <label class="dg-muted" style="display:grid;gap:6px;">Имя
                    <input type="text" name="first_name" value="{{ case.patient.first_name }}" required>
                </label>
                <label class="dg-muted" style="display:grid;gap:6px;">Отчество
                    <input type="text" name="middle_name" value="{{ case.patient.middle_name }}">
                </label>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                <label class="dg-muted" style="display:grid;gap:6px;">Телефон
                    <input type="tel" name="phone" value="{{ case.patient.phone }}" required>
                </label>
                <label class="dg-muted" style="display:grid;gap:6px;">Дата рождения
                    <input type="date" name="birth_date" value="{{ case.patient.birth_date|date:'Y-m-d' }}">
                </label>
            </div>
            <label class="dg-muted" style="display:grid;gap:6px;">Комментарий о пациенте
                <textarea name="comment" rows="2">{{ case.patient.comment }}</textarea>
            </label>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px;">
            <button type="button" @click="modal = null">Отмена</button>
            <button type="submit" class="btn-primary">Сохранить</button>
        </div>
    </form>
</div>
