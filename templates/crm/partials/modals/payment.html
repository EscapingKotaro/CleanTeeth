<div x-show="modal === 'payment'" x-cloak class="fixed inset-0 z-50" style="display:flex;align-items:center;justify-content:center;padding:16px;">
    <form method="post" action="{% url 'crm:payment_create' case.plan.id %}"
          class="dg-panel" style="max-width:420px;width:100%;margin:0;background:var(--dg-solid);" @click.stop>
        {% csrf_token %}
        <div class="dg-panelhead"><h2>Внести платёж</h2></div>
        <div style="display:grid;gap:12px;">
            <label class="dg-muted" style="display:grid;gap:6px;">Сумма, ₽ <span style="color:var(--dg-warn);">*</span>
                <input type="number" step="0.01" name="amount" required>
            </label>
            <label class="dg-muted" style="display:grid;gap:6px;">Дата оплаты
                <input type="date" name="payment_date" value="{% now 'Y-m-d' %}">
            </label>
            {% if case.plan.plan_type == 'ADVANCE' and case.plan.schedule.all %}
            <label class="dg-muted" style="display:grid;gap:6px;">Пункт графика
                <select name="schedule_item_id">
                    <option value="">Вне графика</option>
                    {% for item in case.plan.schedule.all %}
                    <option value="{{ item.id }}">
                        {{ item.due_date|date:"d.m.Y" }} · {{ item.planned_amount }} ₽{% if item.is_advance %} (аванс){% endif %}
                    </option>
                    {% endfor %}
                </select>
            </label>
            {% endif %}
            <label style="display:flex;align-items:center;gap:8px;">
                <input type="checkbox" name="is_advance" class="dg-check">
                <span>Это аванс</span>
            </label>
            <label class="dg-muted" style="display:grid;gap:6px;">Комментарий
                <input type="text" name="comment">
            </label>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px;">
            <button type="button" @click="modal = null">Отмена</button>
            <button type="submit" class="btn-primary">Внести</button>
        </div>
    </form>
</div>
