<div x-show="modal === 'edit_plan'" x-cloak class="fixed inset-0 z-50" style="display:flex;align-items:center;justify-content:center;padding:16px;">
    <form method="post" action="{% url 'crm:plan_update' case.plan.id %}"
          class="dg-panel" style="max-width:720px;width:100%;margin:0;background:var(--dg-solid);max-height:90vh;overflow-y:auto;" @click.stop>
        {% csrf_token %}
        <div class="dg-panelhead"><h2>Редактировать план лечения</h2></div>
        <div style="display:grid;gap:12px;">
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;">
                <label class="dg-muted" style="display:grid;gap:6px;">Первоначальная, ₽
                    <input type="number" step="0.01" name="initial_sum" value="{{ case.plan.initial_sum }}">
                </label>
                <label class="dg-muted" style="display:grid;gap:6px;">Презентация, ₽
                    <input type="number" step="0.01" name="presentation_sum" value="{{ case.plan.presentation_sum }}">
                </label>
                <label class="dg-muted" style="display:grid;gap:6px;">Согласованная, ₽
                    <input type="number" step="0.01" name="agreed_sum" value="{{ case.plan.agreed_sum }}">
                </label>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                <label class="dg-muted" style="display:grid;gap:6px;">Дата презентации
                    <input type="date" name="presentation_date" value="{{ case.plan.presentation_date|date:'Y-m-d' }}">
                </label>
                <label class="dg-muted" style="display:grid;gap:6px;">Дата согласования
                    <input type="date" name="agreement_date" value="{{ case.plan.agreement_date|date:'Y-m-d' }}">
                </label>
            </div>
                <fieldset class="dg-muted" style="display:grid;gap:6px;border:0;padding:0;margin:0;">
                    <legend style="padding:0;margin:0 0 4px;">Лечащие врачи (можно несколько)</legend>
                    <div style="display:grid;gap:4px;max-height:150px;overflow-y:auto;">
                        {% for d in doctors %}
                        <label style="display:flex;align-items:center;gap:8px;">
                            <input type="checkbox" name="doctor_ids" value="{{ d.id }}" class="dg-check"
                                   {% if d in case.plan.doctors.all %}checked{% endif %}>
                            <span>{{ d.last_name }} {{ d.first_name }} {{ d.middle_name }}</span>
                        </label>
                        {% endfor %}
                    </div>
                </fieldset>
            <label class="dg-muted" style="display:grid;gap:6px;">Тип плана
                <select name="plan_type">
                    <option value="">Не выбран</option>
                    {% for value, label in plan_types %}
                    <option value="{{ value }}" {% if case.plan.plan_type == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </label>
                        {% if can_reassign %}
            <label class="dg-muted" style="display:grid;gap:6px;">Ответственный куратор
                <select name="curator_id">
                    {% for u in curators %}
                    <option value="{{ u.id }}" {% if u.id == case.curator_id %}selected{% endif %}>
                        {{ u.get_full_name|default:u.username }}
                    </option>
                    {% endfor %}
                </select>
                <span style="font-size:11px;">Смена ответственного попадёт в журнал как «Смена ответственного».</span>
            </label>
            {% endif %}
        </div>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px;">
            <button type="button" @click="modal = null">Отмена</button>
            <button type="submit" class="btn-primary">Сохранить</button>
        </div>
    </form>
</div>
