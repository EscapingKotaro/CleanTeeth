<div x-show="modal === 'complete_task'" x-cloak class="fixed inset-0 z-50" style="display:flex;align-items:center;justify-content:center;padding:16px;">
    <form method="post" :action="'{% url 'crm:task_complete' 0 %}'.replace('/0/', '/' + taskId + '/')" class="dg-panel"
          style="max-width:520px;width:100%;margin:0;background:var(--dg-solid);max-height:90vh;overflow-y:auto;" @click.stop>
        {% csrf_token %}
        <input type="hidden" name="next" value="{% url 'crm:case_detail' case.id %}">
        <div class="dg-panelhead"><h2>Выполнить задачу</h2></div>
        <label class="dg-muted" style="display:grid;gap:6px;">Результат
            <textarea name="result" rows="3" placeholder="Итог разговора, договорённости..."></textarea>
        </label>
        <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--dg-line);display:grid;gap:12px;">
            <p class="dg-muted" style="font-size:12px;">Следующее действие — обязательно, если это последняя задача активного КПЛ.</p>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                <label class="dg-muted" style="display:grid;gap:6px;">Тип следующего действия
                    <select name="next_action_type">
                        {% for value, label in task_types %}
                        <option value="{{ value }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </label>
                <label class="dg-muted" style="display:grid;gap:6px;">Дата и время
                    <input type="datetime-local" name="next_action_date" value="{% now 'Y-m-d\TH:i' %}" step="1800">
                </label>
            </div>
            <label class="dg-muted" style="display:grid;gap:6px;">Описание следующего действия
                <input type="text" name="next_description" placeholder="Если пусто — подставим стандартное">
            </label>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px;">
            <button type="button" @click="modal = null">Отмена</button>
            <button type="submit" class="btn-primary" style="background:var(--dg-green);border-color:var(--dg-green);">Выполнено</button>
        </div>
    </form>
</div>
