<div x-show="modal === 'new_task'" x-cloak class="fixed inset-0 z-50" style="display:flex;align-items:center;justify-content:center;padding:16px;">
    <form method="post" action="{% url 'crm:task_create' case.id %}"
          class="dg-panel" style="max-width:720px;width:100%;margin:0;background:var(--dg-solid);max-height:90vh;overflow-y:auto;" @click.stop>
        {% csrf_token %}
        <div class="dg-panelhead"><h2>Новая задача</h2></div>
        <div style="display:grid;gap:12px;">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                <label class="dg-muted" style="display:grid;gap:6px;">Тип задачи
                    <select name="task_type">
                        {% for value, label in task_types %}
                        <option value="{{ value }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </label>
                <label class="dg-muted" style="display:grid;gap:6px;">Приоритет
                    <select name="priority">
                        {% for value, label in priorities %}
                        <option value="{{ value }}" {% if value == '2' %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </label>
            </div>
            <label class="dg-muted" style="display:grid;gap:6px;">Описание
                <input type="text" name="description">
            </label>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                <label class="dg-muted" style="display:grid;gap:6px;">Дата и время <span style="color:var(--dg-warn);">*</span>
                    <input type="datetime-local" name="due_date" value="{% now 'Y-m-d\TH:i' %}" required>
                </label>
                <label class="dg-muted" style="display:grid;gap:6px;">Ответственный
                    <select name="assignee_id">
                        {% for u in curators %}
                        <option value="{{ u.id }}" {% if u.id == case.curator_id %}selected{% endif %}>{{ u.get_full_name|default:u.username }}</option>
                        {% endfor %}
                    </select>
                </label>
            </div>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px;">
            <button type="button" @click="modal = null">Отмена</button>
            <button type="submit" class="btn-primary">Создать</button>
        </div>
    </form>
</div>
