{% extends "base_v2.html" %}
{% block title %}{{ title }} · Dento CRM{% endblock %}

{% block content %}
<div class="dg-heading">
    <div>
        <div class="dg-tag">Администрирование</div>
        <h1>Пороговые настройки контроля</h1>
        <p class="dg-muted">Сроки, после которых отклонение попадает в контроль отдела</p>
    </div>
</div>

<section class="dg-panel" style="max-width:560px;">
    <form method="post" style="display:grid;gap:12px;">
        {% csrf_token %}
        {% for row in settings_rows %}
        <label class="dg-muted" style="display:grid;gap:6px;">
            {{ row.description|default:row.key }}
            <input type="number" min="0" name="{{ row.key }}" value="{{ row.value }}">
        </label>
        {% endfor %}
        <button type="submit" class="btn-primary" style="justify-self:start;">Сохранить</button>
    </form>
</section>
{% endblock %}
