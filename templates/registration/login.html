{% load static %}
<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход · Dento CRM</title>
    <link rel="stylesheet" href="{% static 'css/dento-theme.css' %}">
    <style>
        body { display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .login-card { max-width: 420px; width: 100%; }
    </style>
</head>
<body>
    <div class="login-card dg-panel" style="background:var(--dg-solid);">
        <div style="text-align:center;margin-bottom:24px;">
            <div class="dg-logo" style="width:48px;height:48px;font-size:28px;margin:0 auto 12px;">d</div>
            <h1 style="margin:0;">Dento CRM</h1>
            <p class="dg-muted">Вход в систему</p>
        </div>

        {% if form.errors %}
        <div class="dg-alert" style="border-left:3px solid var(--dg-red);margin-bottom:16px;">
            <p style="color:var(--dg-red);">Неверный логин или пароль</p>
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div style="display:grid;gap:12px;">
                <label class="dg-muted" style="display:grid;gap:6px;">Логин
                    <input type="text" name="username" autofocus required>
                </label>
                <label class="dg-muted" style="display:grid;gap:6px;">Пароль
                    <input type="password" name="password" required>
                </label>
            </div>
            <button type="submit" class="btn-primary" style="width:100%;margin-top:16px;">Войти</button>
        </form>

        <p class="dg-muted" style="text-align:center;margin-top:16px;font-size:12px;">
            © 2026 JuliDev · Кураторский отдел
        </p>
    </div>

    <script>
        // Тема из localStorage (если юзер уже выбирал)
        const saved = localStorage.getItem('dento-theme') || 'light';
        document.documentElement.dataset.theme = saved;
    </script>
</body>
</html>
