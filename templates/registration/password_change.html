{% extends "base_v2.html" %}
{% block title %}Смена пароля · Dento CRM{% endblock %}

{% block content %}
<div class="dg-heading">
    <div>
        <div class="dg-tag">Профиль</div>
        <h1>Смена пароля</h1>
    </div>
</div>

<section class="dg-panel" style="max-width:480px;">
    <form method="post" style="display:grid;gap:12px;">
        {% csrf_token %}
        {% if form.non_field_errors %}
        <div class="dg-alert" style="border-left:3px solid var(--dg-red);margin:0;">
            <p style="color:var(--dg-red);">{{ form.non_field_errors|striptags }}</p>
        </div>
        {% endif %}
        <label class="dg-muted" style="display:grid;gap:6px;">Старый пароль
            <input type="password" name="old_password" required autofocus>
            {% if form.old_password.errors %}<span style="color:var(--dg-red);font-size:11px;">{{ form.old_password.errors|striptags }}</span>{% endif %}
        </label>
        <label class="dg-muted" style="display:grid;gap:6px;">Новый пароль
            <input type="password" name="new_password1" required>
            {% if form.new_password1.errors %}<span style="color:var(--dg-red);font-size:11px;">{{ form.new_password1.errors|striptags }}</span>{% endif %}
            {% if form.new_password1.help_text %}<span style="font-size:11px;">{{ form.new_password1.help_text|striptags }}</span>{% endif %}
        </label>
        <label class="dg-muted" style="display:grid;gap:6px;">Повторите новый пароль
            <input type="password" name="new_password2" required>
            {% if form.new_password2.errors %}<span style="color:var(--dg-red);font-size:11px;">{{ form.new_password2.errors|striptags }}</span>{% endif %}
        </label>
        <button type="submit" class="btn-primary" style="justify-self:start;">Сменить пароль</button>
    </form>
</section>
{% endblock %}
